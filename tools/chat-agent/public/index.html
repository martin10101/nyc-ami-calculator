<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMI Optix Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e8eaed;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid #2a2d36;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .logo {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  header h1 { font-size: 14px; font-weight: 600; color: #f1f3f5; }
  header p  { font-size: 11px; color: #6b7280; margin-top: 1px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  #stop-btn {
    display: none;
    background: #dc2626;
    border: none;
    border-radius: 7px;
    padding: 6px 14px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    gap: 6px;
    align-items: center;
  }
  #stop-btn.visible { display: flex; }
  #stop-btn:hover { background: #b91c1c; }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #374151;
    flex-shrink: 0;
  }
  #status-dot.running { background: #22c55e; animation: pulse 1.5s ease-in-out infinite; }
  #status-dot.paused  { background: #f59e0b; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .welcome {
    text-align: center;
    padding: 40px 24px;
    color: #4b5563;
  }
  .welcome h2 { font-size: 18px; font-weight: 600; color: #9ca3af; margin-bottom: 8px; }
  .welcome p  { font-size: 13px; line-height: 1.6; }

  .msg { display: flex; gap: 10px; max-width: 860px; }
  .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .msg.user  .avatar { background: #1d4ed8; }
  .msg.agent .avatar { background: #1f2937; border: 1px solid #374151; }

  .bubble {
    padding: 11px 15px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.65;
    max-width: 700px;
  }
  .msg.user  .bubble { background: #1e3a5f; border: 1px solid #2563eb44; }
  .msg.agent .bubble { background: #1a1d27; border: 1px solid #2a2d36; }

  .bubble pre {
    background: #0d1117;
    border: 1px solid #2a2d36;
    border-radius: 6px;
    padding: 9px 12px;
    overflow-x: auto;
    font-size: 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    margin: 8px 0;
    white-space: pre-wrap;
  }

  /* Tool activity strip */
  .tool-strip { display: flex; flex-direction: column; gap: 4px; padding: 2px 0; }

  .tool-pill {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    background: #111827;
    border: 1px solid #374151;
    color: #9ca3af;
    max-width: 100%;
  }
  .tool-pill.running { border-color: #3b82f6; color: #60a5fa; }
  .tool-pill.done    { border-color: #1f4a2a; color: #4ade80; background: #0d1f13; }
  .tool-pill.edited  { border-color: #713f12; color: #fbbf24; background: #1c1207; }

  .pill-icon { flex-shrink: 0; }
  .pill-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pill-label { font-weight: 500; }
  .pill-detail { font-size: 11px; color: #6b7280; word-break: break-all; }

  .spinner {
    width: 10px; height: 10px;
    border: 2px solid #3b82f6;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0; margin-top: 1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .thinking-dots { display: flex; gap: 4px; padding: 6px 0; }
  .thinking-dots span {
    width: 6px; height: 6px; background: #4b5563; border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

  /* Pause / ask-user block */
  .pause-block {
    background: #1c1a0a;
    border: 1px solid #854d0e;
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pause-question { font-size: 13px; color: #fcd34d; line-height: 1.5; }
  .pause-input-row { display: flex; gap: 8px; }
  .pause-input {
    flex: 1;
    background: #0f1117;
    border: 1px solid #854d0e;
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 13px;
    color: #e8eaed;
    outline: none;
    font-family: inherit;
    resize: none;
  }
  .pause-input:focus { border-color: #f59e0b; }
  .resume-btn {
    background: #d97706;
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    align-self: flex-end;
  }
  .resume-btn:hover { background: #b45309; }
  .resume-btn:disabled { background: #374151; cursor: not-allowed; }

  /* Stopped / error banner */
  .banner {
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    margin-top: 4px;
  }
  .banner.stopped { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
  .banner.error   { background: #1f0a0a; color: #f87171; border: 1px solid #7f1d1d; }

  /* Input area */
  #input-area {
    padding: 14px 20px 18px;
    border-top: 1px solid #2a2d36;
    flex-shrink: 0;
  }
  #input-row {
    display: flex;
    gap: 10px;
    background: #1a1d27;
    border: 1px solid #2a2d36;
    border-radius: 12px;
    padding: 9px 12px;
    transition: border-color 0.15s;
  }
  #input-row:focus-within { border-color: #3b82f6; }
  #msg-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 13.5px;
    color: #e8eaed;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    font-family: inherit;
  }
  #msg-input::placeholder { color: #4b5563; }
  #send-btn {
    background: #2563eb;
    border: none;
    border-radius: 7px;
    width: 32px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; align-self: flex-end;
    transition: background 0.15s;
  }
  #send-btn:hover:not(:disabled) { background: #1d4ed8; }
  #send-btn:disabled { background: #374151; cursor: not-allowed; }
  #send-btn svg { width: 15px; height: 15px; fill: white; }
  #hint { font-size: 11px; color: #374151; margin-top: 7px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <div>
    <h1>AMI Optix Agent</h1>
    <p>Autonomous repair &amp; test agent</p>
  </div>
  <div class="header-right">
    <div id="status-dot"></div>
    <button id="stop-btn">■ Stop</button>
  </div>
</header>

<div id="chat">
  <div class="welcome">
    <h2>How can I help?</h2>
    <p>Describe a problem and I'll test, diagnose, fix, and report back.<br>I'll ask you if I get stuck — otherwise I'll work through it on my own.</p>
  </div>
</div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg-input" rows="1" placeholder="Describe the issue..."></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <p id="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
</div>

<script>
const chatEl    = document.getElementById('chat');
const inputEl   = document.getElementById('msg-input');
const sendBtn   = document.getElementById('send-btn');
const stopBtn   = document.getElementById('stop-btn');
const statusDot = document.getElementById('status-dot');

let history    = [];
let busy       = false;
let currentSessionId = null;
let abortCtrl  = null;

const TOOL_LABELS = {
  run_acceptance_tests: { icon: '🧪', label: 'Running acceptance tests…' },
  run_full_refresh:     { icon: '🔄', label: 'Running full refresh (build + test)…' },
  list_source_files:    { icon: '📂', label: 'Listing source files…' },
  read_source_file:     { icon: '📄', label: 'Reading source file…' },
  edit_source_file:     { icon: '✏️',  label: 'Editing source file…' },
  read_results:         { icon: '📊', label: 'Reading test results…' },
  read_build_result:    { icon: '🔨', label: 'Reading build result…' },
  compile_check:        { icon: '🔍', label: 'Checking compile…' },
  ask_user:             { icon: '❓', label: 'Asking you a question…' }
};
const TOOL_DONE = {
  run_acceptance_tests: 'Tests complete',
  run_full_refresh:     'Refresh complete',
  list_source_files:    'Files listed',
  read_source_file:     'File read',
  edit_source_file:     'File edited',
  read_results:         'Results read',
  read_build_result:    'Build result read',
  compile_check:        'Compile check complete',
  ask_user:             'Waiting for your answer…'
};

function setRunning(running) {
  busy = running;
  sendBtn.disabled = running;
  statusDot.className = running ? 'running' : '';
  if (running) stopBtn.classList.add('visible');
  else stopBtn.classList.remove('visible');
}

function setPaused() {
  statusDot.className = 'paused';
}

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function removeWelcome() {
  const w = chatEl.querySelector('.welcome');
  if (w) w.remove();
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function renderText(text) {
  return text
    .replace(/```([\s\S]*?)```/g, (_, c) => `<pre>${esc(c.trim())}</pre>`)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function appendUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar">👤</div><div class="bubble">${esc(text).replace(/\n/g,'<br>')}</div>`;
  chatEl.appendChild(div);
  scrollBottom();
}

function createAgentBubble() {
  const div = document.createElement('div');
  div.className = 'msg agent';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '⚡';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  bubble.appendChild(dots);

  const toolStrip = document.createElement('div');
  toolStrip.className = 'tool-strip';
  bubble.appendChild(toolStrip);

  const textNode = document.createElement('div');
  textNode.className = 'msg-text';
  bubble.appendChild(textNode);

  div.appendChild(avatar);
  div.appendChild(bubble);
  chatEl.appendChild(div);
  scrollBottom();

  return { bubble, toolStrip, textNode, dots };
}

stopBtn.addEventListener('click', async () => {
  if (currentSessionId) {
    try {
      await fetch('/api/abort/' + currentSessionId, { method: 'POST' });
    } catch {}
  }
  if (abortCtrl) abortCtrl.abort();
});

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  setRunning(true);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  removeWelcome();
  appendUserMsg(text);

  const { bubble, toolStrip, textNode, dots } = createAgentBubble();
  const activePills = {};
  let agentText = '';
  let sessionId = null;

  abortCtrl = new AbortController();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history }),
      signal: abortCtrl.signal
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }

        if (event.type === 'session') {
          sessionId = event.data;
          currentSessionId = sessionId;
        }

        if (event.type === 'tool_start') {
          dots.style.display = 'none';
          const info = TOOL_LABELS[event.data] || { icon: '⚙️', label: event.data };
          const pill = document.createElement('div');
          pill.className = 'tool-pill running';
          pill.innerHTML = `
            <div class="pill-icon"><div class="spinner"></div></div>
            <div class="pill-body"><div class="pill-label">${info.icon} ${info.label}</div></div>`;
          toolStrip.appendChild(pill);
          activePills[event.data] = pill;
          scrollBottom();
        }

        if (event.type === 'file_edited') {
          const pill = activePills['edit_source_file'];
          if (pill) {
            pill.className = 'tool-pill edited';
            pill.innerHTML = `
              <div class="pill-icon">✏️</div>
              <div class="pill-body">
                <div class="pill-label">Edited ${esc(event.data.path)}</div>
                <div class="pill-detail">Replaced: ${esc(event.data.preview)}…</div>
              </div>`;
          }
          scrollBottom();
        }

        if (event.type === 'tool_done') {
          const pill = activePills[event.data];
          if (pill && event.data !== 'edit_source_file') {
            pill.className = 'tool-pill done';
            const info = TOOL_LABELS[event.data] || { icon: '✓', label: event.data };
            pill.innerHTML = `
              <div class="pill-icon">${info.icon}</div>
              <div class="pill-body"><div class="pill-label">${TOOL_DONE[event.data] || event.data}</div></div>`;
          }
          scrollBottom();
        }

        if (event.type === 'pause') {
          dots.style.display = 'none';
          setPaused();
          const block = document.createElement('div');
          block.className = 'pause-block';
          const ta = document.createElement('textarea');
          ta.className = 'pause-input';
          ta.rows = 3;
          const btn = document.createElement('button');
          btn.className = 'resume-btn';
          btn.textContent = 'Continue →';
          block.innerHTML = `<div class="pause-question">❓ ${esc(event.data.question).replace(/\n/g,'<br>')}</div>`;
          block.appendChild(document.createElement('div'));
          const row = block.querySelector('div:last-child');
          row.className = 'pause-input-row';
          row.appendChild(ta);
          row.appendChild(btn);
          bubble.appendChild(block);
          scrollBottom();
          ta.focus();

          const sendResume = async () => {
            const answer = ta.value.trim();
            if (!answer) return;
            btn.disabled = true;
            ta.disabled = true;
            setRunning(true);
            try {
              await fetch('/api/resume/' + sessionId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer })
              });
            } catch {}
          };

          btn.addEventListener('click', sendResume);
          ta.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendResume(); }
          });
        }

        if (event.type === 'text_chunk') {
          dots.style.display = 'none';
          agentText += event.data;
          textNode.innerHTML = renderText(agentText);
          scrollBottom();
        }

        if (event.type === 'text') {
          dots.style.display = 'none';
          agentText += event.data;
          textNode.innerHTML = renderText(agentText);
          scrollBottom();
        }

        if (event.type === 'dialog_dismissed') {
          dots.style.display = 'none';
          const pill = document.createElement('div');
          pill.className = 'tool-pill edited';
          pill.innerHTML = `
            <div class="pill-icon">⚠️</div>
            <div class="pill-body">
              <div class="pill-label">Excel dialog auto-dismissed</div>
              <div class="pill-detail">${esc(event.data)}</div>
            </div>`;
          toolStrip.appendChild(pill);
          scrollBottom();
        }

        if (event.type === 'stopped') {
          dots.style.display = 'none';
          const banner = document.createElement('div');
          banner.className = 'banner stopped';
          banner.textContent = '■ Stopped by user.';
          bubble.appendChild(banner);
          scrollBottom();
        }

        if (event.type === 'error') {
          dots.style.display = 'none';
          const banner = document.createElement('div');
          banner.className = 'banner error';
          banner.textContent = '⚠ Error: ' + event.data;
          bubble.appendChild(banner);
          scrollBottom();
        }

        if (event.type === 'done') {
          dots.style.display = 'none';
          scrollBottom();
        }
      }
    }

    history.push({ role: 'user', content: text });
    if (agentText) history.push({ role: 'assistant', content: agentText });
    if (history.length > 40) history = history.slice(-40);

  } catch (err) {
    if (err.name !== 'AbortError') {
      dots.style.display = 'none';
      const banner = document.createElement('div');
      banner.className = 'banner error';
      banner.textContent = '⚠ Connection error: ' + err.message;
      bubble.appendChild(banner);
    } else {
      dots.style.display = 'none';
    }
    scrollBottom();
  }

  currentSessionId = null;
  abortCtrl = null;
  setRunning(false);
  inputEl.focus();
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', sendMessage);
</script>
</body>
</html>
